name: CI
on:
  push:
  pull_request:
jobs:
  plataforma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libgl1  # OpenCV usado pelo OCR
      - run: pip install -r requirements.txt
      - run: pytest -q tests
